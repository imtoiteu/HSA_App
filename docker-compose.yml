# HSA-app production stack (project name "hsaapp"). Only the web container publishes a port.
#   cp .env.example .env   # then fill in secrets
#   deploy/deploy.sh       # build + start + health check
name: hsaapp

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hsa}
      POSTGRES_USER: ${POSTGRES_USER:-hsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=512MB -c work_mem=8MB
               -c maintenance_work_mem=64MB -c max_connections=40 -c wal_buffers=4MB
               -c checkpoint_completion_target=0.9 -c random_page_cost=1.5
               -c log_min_duration_statement=1000 -c idle_in_transaction_session_timeout=60000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m
    cpus: 1.5
    networks: [internal]
    logging: *logging

  api:
    image: hsaapp-api:${APP_VERSION:-latest}
    build:
      context: ./backend
      args:
        WITH_IMAGEMAGICK: ${API_WITH_IMAGEMAGICK:-1}
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HSA_ENV: production
      HSA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hsa}
      HSA_UPSTREAM_ROOT: /upstream
      HSA_MEDIA_ROOT: /data/media
    command: ["api"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - media:/data/media
      - ${UPSTREAM_PATH:-/root/imtoiteu/HSA-question-bank}:/upstream:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 40s
    mem_limit: 900m
    cpus: 1.5
    networks: [internal]
    logging: *logging

  scheduler:
    image: hsaapp-api:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      HSA_ENV: production
      HSA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hsa}
    command: ["scheduler"]
    init: true
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 160m
    cpus: 0.25
    networks: [internal]
    logging: *logging

  web:
    image: hsaapp-web:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8620}:80"
    volumes:
      - media:/srv/media:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    cpus: 0.5
    networks: [internal]
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hsa}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hsa}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.5
    networks: [internal]
    logging: *logging

volumes:
  pgdata:
  media:

networks:
  internal:
